<header class="header">
  <div class="header-container">
    <a routerLink="/" class="name-logo" (click)="closeMenu()">
      <img class="logo" src="img/logo.png" alt="LDN MARC" class="logo" width="32px">
      MARC LIDÓN
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Open menu"
      [class.is-open]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.is-open]="menuOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
        <a routerLink="/posts" routerLinkActive="active" (click)="closeMenu()">Posts</a>
        <!-- <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
     -->
        <button type="button" class="theme-toggle" (click)="toggleTheme()">
            {{ darkMode() ? 'Light' : 'Dark' }}
        </button>
    
    </nav>

    
  </div>
</header>
