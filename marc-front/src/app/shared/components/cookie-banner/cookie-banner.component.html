@if (visible) {
  <div class="cookie-banner" role="dialog" aria-label="Aviso de cookies">
    <div class="cookie-icon">🍪</div>

    <div class="cookie-content">
      <h2>Cookies</h2>
      <p>
        Utilizo cookies básicas para mejorar la experiencia de navegación y recordar tus preferencias.
        Puedes aceptar o rechazar su uso.
      </p>

      <a routerLink="/privacy">Leer política de privacidad</a>
    </div>

    <div class="cookie-actions">
      <button type="button" class="button ghost" (click)="reject()">
        Rechazar
      </button>

      <button type="button" class="button accept" (click)="accept()">
        Aceptar
      </button>
    </div>
  </div>
}
